<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F45">
<title>Video Finder · Sign in</title>
<link rel="icon" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy-1000:#0B1F45;--navy-950:#0F2A5C;--gold-400:#DCC080;--gold-500:#C9A961;--ink:#0A1530;--ink-3:#6A7288;
    --gold-grad:linear-gradient(115deg,#9C7F3F 0%,#D9BC78 28%,#F3E2B0 46%,#C9A961 62%,#8E7238 100%)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px 16px;
    background:radial-gradient(120% 80% at 50% 0%,#1A4085 0%,var(--navy-950) 40%,var(--navy-1000) 100%);color:#fff;font:15px/1.6 "Manrope",system-ui,sans-serif}
  .logo{height:34px;margin-bottom:28px}
  form{width:100%;max-width:380px}
  .eyebrow{display:flex;align-items:center;gap:12px;font-size:11.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-400);margin:0 0 12px}
  .eyebrow::before{content:"";width:28px;height:1px;background:var(--gold-500)}
  h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:44px;line-height:1.05;margin:0 0 8px}
  h1 em{color:var(--gold-400)}
  p{margin:0 0 24px;color:rgba(255,255,255,.7)}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);margin:16px 0 6px}
  input{width:100%;height:50px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:16px}
  input:focus{outline:0;border-color:var(--gold-500);background:rgba(255,255,255,.1)}
  button{margin-top:26px;width:100%;height:52px;border:0;border-radius:999px;background:var(--gold-grad);color:var(--navy-1000);font:inherit;font-weight:700;letter-spacing:.04em;cursor:pointer}
  .err{margin-top:14px;color:#ffb4a8;font-size:14px;text-align:center}
</style>
</head>
<body>
<img class="logo" src="/static/logo-light.png" alt="TSLAW Group">
<form method="post">
  <p class="eyebrow">AI video assistant</p>
  <h1>Video <em>Finder</em></h1>
  <p>Describe a scene, and I'll find the video.</p>
  <label for="name">Your name</label>
  <input id="name" name="name" placeholder="e.g. Alex" autocomplete="name" required>
  <label for="pw">Team password</label>
  <input id="pw" name="password" type="password" required autocomplete="current-password">
  <button>Sign in</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
</form>
</body>
</html>
