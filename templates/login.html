<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Finder · Sign in</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#16181d; --muted:#667085; --line:#e4e7ec; --accent:#2f5bea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --text:#eef0f3; --muted:#98a2b3; --line:#2a2f38; --accent:#6d8cff; } }
  * { box-sizing:border-box } body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:16px }
  form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; width:100%; max-width:360px }
  h1 { margin:0 0 4px; font-size:22px } p { margin:0 0 20px; color:var(--muted) }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit }
  button { margin-top:20px; width:100%; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer }
  .err { color:#d92d20; margin-top:12px; font-size:14px }
</style>
</head>
<body>
<form method="post">
  <h1>🎬 Video Finder</h1>
  <p>Describe a scene and find the video.</p>
  <label for="name">Your name</label>
  <input id="name" name="name" placeholder="e.g. Alex" autocomplete="name">
  <label for="pw">Team password</label>
  <input id="pw" name="password" type="password" required autofocus autocomplete="current-password">
  <button>Sign in</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
</form>
</body>
</html>
