<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0B1F45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI视频搜索 · TSLAW Group</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI视频搜索">
<script src="/static/pwa.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css?v=10">
<style>
/* ================= layout ================= */
body{background:var(--ivory);min-height:100dvh}
body.on-ask{background:var(--navy-1000);color:#fff}
.top{position:fixed;inset:0 0 auto;z-index:40;height:var(--top);display:flex;align-items:center;gap:10px;padding:var(--sat) 12px 0;
  background:rgba(11,31,69,.86);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line-light);color:#fff}
.brand{display:flex;align-items:center;gap:10px;min-width:0;color:#fff;text-decoration:none}
.brand img{height:24px;width:auto;display:block}
.brand b{font-family:var(--serif);font-weight:600;font-size:20px;white-space:nowrap;padding-left:10px;border-left:1px solid var(--line-light)}
.brand b em{font-style:italic;color:var(--gold-400)}
.top__end{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-light);background:rgba(255,255,255,.05);color:#fff;display:grid;place-items:center}
.iconbtn svg{width:19px;height:19px}
.menubtn{display:grid}

/* side rail (desktop) & drawer (phones): admin tools live here */
.rail{display:none}
.drawer{position:fixed;inset:0 auto 0 0;z-index:70;width:min(300px,84vw);background:var(--navy-1000);color:#fff;border-right:1px solid var(--line-light);
  transform:translateX(-102%);transition:transform .45s var(--ease);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + var(--safe))}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;z-index:65;background:rgba(3,10,26,.55);opacity:0;pointer-events:none;transition:opacity .4s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer img{height:26px;align-self:flex-start;margin:4px 8px 22px}
.navitem{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;border:0;border-radius:4px;background:none;color:rgba(255,255,255,.78);font-size:15px;font-weight:600;text-align:left;text-decoration:none}
.navitem svg{width:21px;height:21px;flex:none;color:var(--gold-400)}
.navitem[aria-current=true]{background:rgba(201,169,97,.14);color:#fff}
.navitem:hover{background:rgba(255,255,255,.06)}
.navsec{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.4);margin:18px 14px 6px}
.drawer__foot{margin-top:auto;border-top:1px solid var(--line-light);padding-top:12px}
.drawer__who{font-size:13px;color:rgba(255,255,255,.55);padding:4px 14px 8px}
.drawer__who b{color:#fff}

main{padding-top:var(--top)}

/* ================= ASK (boss mode) ================= */
.aurora .bd-tower{transition:opacity .8s var(--ease)}
.aurora::after{content:"";position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(to top,rgba(11,31,69,.95),rgba(11,31,69,0))}
.has-thread .aurora .bd-tower{opacity:.3}
.has-thread .aurora .bd-city{opacity:.15}
.has-thread .aurora .bd-waves{opacity:.6}
#view-ask{position:relative;min-height:calc(100dvh - var(--top));padding-bottom:calc(96px + var(--safe))}
.stage{position:relative;z-index:2;min-height:calc(100dvh - var(--top) - 96px - var(--safe));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px 12px}
.has-thread .stage{display:none}
.has-thread .stage.overlay{display:flex;position:fixed;inset:0;z-index:80;min-height:0;background:rgba(7,19,44,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.greet{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-400);margin:0 0 10px;display:flex;align-items:center;gap:12px}
.greet::before,.greet::after{content:"";width:26px;height:1px;background:var(--gold-500);opacity:.7}
.stage h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,7.4vw,48px);line-height:1.15;margin:0 0 clamp(22px,5vh,44px);max-width:640px}
.stage h1 em{font-style:italic;color:var(--gold-400)}
.status{text-shadow:0 1px 12px rgba(7,19,44,.95);margin:clamp(22px,4vh,36px) 0 0;font-size:17px;font-weight:600;letter-spacing:.04em;color:#fff;min-height:1.6em}
.live{margin:10px 0 0;font-family:var(--serif);font-size:clamp(22px,5.6vw,30px);line-height:1.3;color:var(--gold-300);max-width:640px;min-height:1.3em}
.hint{margin:6px 0 0;font-size:14px;color:rgba(255,255,255,.72);max-width:520px;text-shadow:0 1px 10px rgba(7,19,44,.95),0 0 3px rgba(7,19,44,.9)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px;max-width:640px}
.chip{border:1px solid rgba(220,192,128,.3);background:rgba(9,24,54,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:rgba(255,255,255,.82);border-radius:999px;padding:8px 14px;font-size:13.5px;transition:border-color .3s,background .3s}
.chip:hover{border-color:var(--gold-500);background:rgba(201,169,97,.12)}
.stage[data-state=listening] .hint,.stage[data-state=listening] .chips,.stage[data-state=thinking] .hint,.stage[data-state=thinking] .chips,
.stage[data-state=listening] h1,.stage[data-state=thinking] h1{visibility:hidden}
.stage .cancel{display:none;margin-top:22px}
.stage.overlay .cancel,.stage[data-state=listening] .cancel{display:inline-flex}

/* ---------- conversation ---------- */
.thread{position:relative;z-index:2;max-width:860px;margin:0 auto;padding:18px 16px 10px;display:flex;flex-direction:column;gap:18px}
.thread:empty{display:none}
.msg-user{align-self:flex-end;max-width:85%;background:rgba(201,169,97,.16);border:1px solid rgba(201,169,97,.35);color:#fff;padding:10px 16px;border-radius:18px 18px 4px 18px;word-wrap:break-word}
.msg-user svg{width:13px;height:13px;vertical-align:-1px;margin-right:6px;color:var(--gold-400)}
.msg-ai{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:34px;height:34px}
.ai-body{flex:1;min-width:0}
.ai-text{font-size:15.5px;line-height:1.65;padding-top:4px;color:rgba(255,255,255,.94)}
.ai-text b{font-weight:700;color:#fff}
.ai-text em{font-style:normal;color:var(--gold-400);font-weight:600}
.ai-sub{font-size:13px;color:rgba(255,255,255,.55);margin-top:4px}
.thinking{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.7);padding-top:6px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--gold-400);animation:blink 1.2s infinite both}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

.cards{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
.vcard{background:rgba(255,255,255,.04);border:1px solid var(--line-light);border-radius:4px;overflow:hidden;animation:rise .55s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.vcard__media{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;background:#000;overflow:hidden}
.vcard__media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.vcard__media:hover img{transform:scale(1.03)}
.vcard__media .play{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(11,31,69,.55);backdrop-filter:blur(4px);display:grid;place-items:center;color:var(--gold-300);border:1px solid rgba(220,192,128,.5)}
.vcard__media .play svg{width:20px;height:20px;margin-left:3px}
.tstamp{position:absolute;left:10px;bottom:10px;background:rgba(11,31,69,.85);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.badge{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.badge.strong{background:var(--gold-grad);color:var(--navy-1000)}
.badge.possible{background:rgba(255,255,255,.9);color:var(--ink-2)}
.vcard__body{padding:12px 14px 14px}
.vcard h3{margin:0;font-size:15px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcard .meta{color:rgba(255,255,255,.55)}
.moments{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.moments::-webkit-scrollbar{display:none}
.moment{flex:none;width:96px;border:1px solid var(--line-light);background:none;padding:0;border-radius:4px;overflow:hidden;text-align:left;color:rgba(255,255,255,.8)}
.moment img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.moment span{display:block;font-size:11.5px;font-weight:600;padding:3px 6px}
.moment.on{border-color:var(--gold-500)}
.ai-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- dock (bottom) ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(12px + var(--safe));background:linear-gradient(to top,rgba(11,31,69,1) 55%,rgba(11,31,69,0))}
.dock__in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
.field{flex:1;min-width:0;display:flex;align-items:flex-end;gap:6px;background:rgba(255,255,255,.07);border:1px solid var(--line-light);border-radius:26px;padding:4px 4px 4px 16px;transition:border-color .3s,background .3s}
.field:focus-within{border-color:var(--gold-500);background:rgba(255,255,255,.1)}
.field textarea{flex:1;min-width:0;border:0;outline:0;resize:none;background:none;color:#fff;font:inherit;font-size:16px;line-height:1.4;padding:9px 0;height:42px;max-height:120px}
.field textarea::placeholder{color:rgba(255,255,255,.45)}
.send{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--gold-grad);color:var(--navy-1000);display:grid;place-items:center;transition:opacity .2s,transform .3s var(--ease)}
.send svg{width:19px;height:19px}
.send[disabled]{opacity:.25}
.dock .orb{--size:56px;display:none}
.has-thread .dock .orb{display:block}

/* ================= ADMIN pages (light) ================= */
.view{max-width:1000px;margin:0 auto;padding:24px 16px calc(40px + var(--safe))}
.pagehead h2{font-family:var(--serif);font-weight:500;font-size:clamp(30px,7vw,46px);line-height:1.1;margin:0}
.pagehead h2 em{color:var(--gold-700)}
.pagehead p{color:var(--ink-2);margin:8px 0 20px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;border:1.5px dashed rgba(169,139,71,.55);border-radius:4px;background:var(--paper);padding:36px 18px;cursor:pointer;transition:background .3s,border-color .3s}
.drop.over{background:#fff;border-color:var(--gold-500)}
.drop .ic{width:56px;height:56px;border-radius:50%;background:var(--navy-1000);color:var(--gold-400);display:grid;place-items:center}
.drop .ic svg{width:24px;height:24px}
.drop b{font-size:16px}
.uplist{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:4px}
.uplist:empty{display:none}
.up{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
.up:last-child{border-bottom:0}
.up .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.up .s{font-size:12.5px;color:var(--ink-3);text-align:right}
.up .s.ok{color:#1d7a4a}.up .s.bad{color:#b42318}
.prog{grid-column:1/-1;height:4px;background:var(--ivory);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold-grad);transition:width .3s}
.libtools input{width:100%;height:44px;border:1px solid var(--line);border-radius:999px;padding:0 18px;background:#fff;font:inherit;font-size:16px;color:var(--ink);margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:700;line-height:1.15;color:var(--navy-950)}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.lib{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.lcard{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.lcard .cov{aspect-ratio:16/9;background:var(--navy-1000) center/cover;border:0;padding:0;display:block;width:100%}
.lcard .b{padding:9px 10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.lcard .t{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;padding-top:4px}
.st{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.st.ready{color:#1d7a4a}.st.error{color:#b42318}.st.wait{color:var(--gold-700)}
.del{border:0;background:none;color:var(--ink-3);font-size:12px;padding:4px}
.del:hover{color:#b42318}
.empty{text-align:center;color:var(--ink-3);padding:48px 16px;grid-column:1/-1}
.meta{font-size:12.5px;color:var(--ink-3)}

/* ---------- Lark import ---------- */
.lark{margin-top:26px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:18px}
.lark__head{display:flex;gap:14px;align-items:flex-start}
.lark__logo{flex:none;width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#00D6B9,#3370FF 60%,#1E3A8A);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em}
.lark h3{margin:0;font-size:17px}
.lark p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.lark form{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.lark input{flex:1;min-width:220px;height:44px;border:1px solid var(--line);border-radius:999px;padding:0 16px;font:inherit;font-size:15px;background:var(--paper);color:var(--ink)}
.lark .btn{color:#fff;border:0;background:var(--navy-1000)}
.notice{margin-top:12px;background:var(--ivory);border-left:3px solid var(--gold-500);padding:10px 12px;font-size:13.5px;color:var(--ink-2)}
.src{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.src .nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .msg{grid-column:1/-1;font-size:13px;color:var(--ink-2)}
.src .msg.bad{color:#b42318}
.src .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lark .range{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;font-size:14px;color:var(--ink-2)}
.lark .range input{flex:none;min-width:0;width:96px;height:40px;padding:0 12px;text-align:center}
.rhint{width:100%;margin:0!important;font-size:12.5px!important;color:var(--ink-3)!important}
.src .rng{font-size:12.5px;color:var(--ink-2);margin-top:2px;grid-column:1/-1}
.src .edit{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:14px}
.src .edit input{flex:none;min-width:0;width:84px;height:36px;border:1px solid var(--line);border-radius:999px;padding:0 10px;text-align:center;font:inherit;background:var(--paper)}
.src .edit button{border:0;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;background:var(--navy-1000);color:#fff}
.src .edit button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.src .acts button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.pill.ok{background:#e7f5ee;color:#1d7a4a}.pill.error{background:#fdecea;color:#b42318}.pill.syncing,.pill.queued{background:#fbf3df;color:var(--gold-700)}
.tag-lark{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:#3370FF;border-radius:4px;padding:0 5px;margin-right:5px;vertical-align:1px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.facts span{font-size:12px;color:rgba(255,255,255,.8);background:rgba(255,255,255,.07);border:1px solid var(--line-light);border-radius:999px;padding:2px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facts span b{color:var(--gold-400);font-weight:600}
.facts .path{color:var(--gold-300);border-color:rgba(220,192,128,.35);background:rgba(201,169,97,.1)}
.pl__bot{overflow-y:auto;max-height:42vh}
.details{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:8px 0 0;font-size:13.5px}
.details dt{color:rgba(255,255,255,.55);white-space:nowrap}
.details dd{margin:0;color:#fff;word-break:break-word}
.details a{color:var(--gold-300)}
.badge.text{left:auto;right:10px;background:rgba(51,112,255,.92);color:#fff}

/* ---------- install the app ---------- */
.install-card{position:fixed;left:12px;right:12px;bottom:calc(84px + var(--safe));z-index:35;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding:12px 12px 12px 14px;border-radius:14px;background:rgba(11,31,69,.92);border:1px solid rgba(220,192,128,.4);box-shadow:0 18px 40px rgba(0,0,0,.4);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:rise .6s var(--ease) both}
.install-card img{width:44px;height:44px;border-radius:11px;flex:none}
.install-card div{flex:1;min-width:0;font-size:13px;color:rgba(255,255,255,.72);line-height:1.4}
.install-card b{display:block;color:#fff;font-size:14.5px}
.install-card .go{flex:none;height:36px;padding:0 16px;border:0;border-radius:999px;background:var(--gold-grad);color:var(--navy-1000);font-weight:700}
.install-card .x{flex:none;width:30px;height:30px;border:0;background:none;color:rgba(255,255,255,.5);font-size:20px;line-height:1}
.has-thread .install-card{display:none}
#iosSheet{position:fixed;top:auto;bottom:0;left:0;right:0;width:min(440px,100%);height:auto;max-height:90vh;margin:0 auto;animation:sheet .4s var(--ease);border-radius:18px 18px 0 0;padding:22px 20px calc(22px + var(--safe));background:var(--navy-950)}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
#iosSheet h3{font-family:var(--serif);font-weight:500;font-size:26px;margin:0 0 4px;display:flex;align-items:center;gap:12px}
#iosSheet h3 img{width:40px;height:40px;border-radius:10px}
#iosSheet ol{list-style:none;padding:0;margin:18px 0 20px;display:flex;flex-direction:column;gap:14px}
#iosSheet li{display:flex;gap:12px;align-items:center;font-size:15px}
#iosSheet li span.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold-grad);color:var(--navy-1000);font-weight:800;display:grid;place-items:center;font-size:13px}
#iosSheet li svg{width:22px;height:22px;color:#4ea1ff;flex:none;vertical-align:-5px}
#iosSheet .warn{background:rgba(201,169,97,.14);border:1px solid rgba(201,169,97,.4);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:14px}
#iosSheet .btn{width:100%}

/* ---------- find the same product / suppliers ---------- */

.sup h4::after{content:"";flex:1;height:1px;background:var(--line-light)}
.sup .note{font-size:13px;color:rgba(255,255,255,.55);margin:0 0 10px}
.scard{border:1px solid var(--line-light);background:rgba(255,255,255,.04);border-radius:10px;padding:12px;margin-bottom:10px}
.scard.mine{border-color:rgba(220,192,128,.5);background:rgba(201,169,97,.08)}
.scard .nm{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scard .sub{font-size:12.5px;color:rgba(255,255,255,.6);margin-top:2px}
.scard .desc{font-size:13.5px;color:rgba(255,255,255,.85);margin-top:6px}

.acts2 a,.acts2 button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line-light);background:rgba(255,255,255,.06);color:#fff;font-size:13px;font-weight:600;text-decoration:none}
.acts2 .call{background:var(--gold-grad);color:var(--navy-1000);border:0}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.thumbs button{flex:none;width:104px;padding:0;border:1px solid var(--line-light);border-radius:6px;overflow:hidden;background:#000;position:relative}
.thumbs img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.thumbs span{position:absolute;left:4px;bottom:4px;font-size:10.5px;background:rgba(11,31,69,.85);padding:0 5px;border-radius:4px}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT = s => { s = Math.max(0, Math.round(s || 0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = String(s%60).padStart(2,'0'); return h ? `${h}:${String(m).padStart(2,'0')}:${x}` : `${m}:${x}`; };
const fmtSize = b => b >= 1e9 ? (b/1e9).toFixed(1)+' GB' : b >= 1e6 ? (b/1e6).toFixed(1)+' MB' : Math.max(1, Math.round(b/1e3))+' KB';
const fmtDate = t => t ? new Date(t*1000).toLocaleDateString(I18N.locale(), {day:'numeric', month:'short'}) : '';
const t = I18N.t;
const NAME = {{ (name or "")|tojson }};
async function api(url, opts) { const r = await fetch(url, opts); if (r.status === 401) { location.href = '/login'; throw new Error('login'); } return r; }
function toast(msg) { document.querySelectorAll('.toast').forEach(x => x.remove()); const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.append(el); setTimeout(() => el.remove(), 3500); }

function show(view) {
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-current', b.dataset.view === view));
  ['ask','upload','library'].forEach(v => $('#view-'+v).classList.toggle('hidden', v !== view));
  document.body.classList.toggle('on-ask', view === 'ask');
  $('#dock').classList.toggle('hidden', view !== 'ask');

  closeDrawer();
  if (typeof refreshInstall === 'function') refreshInstall();
  if (view === 'library') loadLib(); else clearTimeout(libTimer);
  if (view === 'upload') loadLark(); else clearTimeout(larkTimer);
  window.scrollTo(0, 0);
}

// ---------- the orb stage ----------
function setStage(state) {
  const st = $('#stage'); st.dataset.state = state;
  $('#orb').dataset.state = state; $('#miniorb').dataset.state = state;
  const threadMode = document.body.classList.contains('has-thread');

// ---------- asking ----------
let results = {}, busy = false;
async function ask(text, opts = {}) {
  if (busy) return; busy = true;
  q.value = ''; autosize(); q.blur();
  const lang = opts.lang || I18N.lang;
  const threadMode = document.body.classList.contains('has-thread');
  const thread = $('#thread');
  const u = document.createElement('div'); u.className = 'msg-user';
  u.innerHTML = (opts.voice ? '<svg><use href="#i-mic"/></svg>' : '') + esc(text);
  const a = document.createElement('div'); a.className = 'msg-ai';
  a.innerHTML = `<span class="orb avatar" data-state="thinking" style="--size:34px"><span class="orb__ring"></span><span class="orb__core"><span class="blob b1"></span><span class="blob b2"></span></span></span><div class="ai-body"></div>`;
  let inline = threadMode && !opts.voice;
  if (inline) {
    a.querySelector('.ai-body').innerHTML = `<div class="thinking"><span class="dots"><i></i><i></i><i></i></span><span>${esc(t('thinking', { n: stats.searchable }))}</span></div>`;
    thread.append(u, a); u.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    if (opts.voice) $('#live').textContent = '“' + text + '”';
    setStage('thinking');
  }
  const started = Date.now();
  let data = null;
  try {
    const r = await api('/api/search?q=' + encodeURIComponent(text));
    if (!r.ok) throw new Error('search failed');
    data = await r.json();
  } catch (err) { if (err.message === 'login') return; }
  await new Promise(r => setTimeout(r, Math.max(0, (inline ? 500 : 1100) - (Date.now() - started))));
  if (!inline) thread.append(u, a);
  document.body.classList.add('has-thread');
  $('#newchat').classList.remove('hidden');
  a.querySelector('.avatar').dataset.state = 'idle';
  const body = a.querySelector('.ai-body');
  if (!data) body.innerHTML = `<div class="ai-text">${esc(t('error'))}</div>`;
  else { stats = { videos: data.videos, searchable: data.searchable }; renderAnswer(body, data, { ...opts, lang }); }
  setStage('idle');
  requestAnimationFrame(() => u.scrollIntoView({ behavior: inline ? 'smooth' : 'auto', block: 'start' }));
  busy = false;
}

function renderAnswer(body, data, opts) {
  const res = data.results, what = esc(data.looking_for);
  const strong = res.filter(r => r.strength === 'strong').length;
  const pending = data.videos - data.searchable;
  let html, speech;
  if (!data.videos) { html = t('empty'); speech = t('say_empty'); }
  else if (!res.length) { html = t('none', { what, n: data.searchable }); speech = t('say_none', { what: data.looking_for }); }
  else {
    const best = res[0], bf = best.frames.reduce((x, y) => y.score > x.score ? y : x);
    html = t('found', { n: res.length, what }) + ' ' +
      (strong ? t('best', { file: esc(best.title || best.filename), when: bf.t < 2 ? t('at_start') : t('at_time', { t: fmtT(bf.t) }) }) : t('close_only'));
    speech = t('say_found', { n: res.length }) + ' ' + (strong ? t('say_best', { s: bf.t }) : t('close_only'));
  }
  const subs = [];
  if (!res.length && data.videos) subs.push(t('none_tip'));
  if (pending > 0) subs.push(t('pending', { n: pending }));
  const id = 'r' + Math.random().toString(36).slice(2);
  results[id] = res;
  body.innerHTML = `<div class="ai-text">${html}</div>${subs.length ? `<div class="ai-sub">${esc(subs.join(' '))}</div>` : ''}
    ${!data.videos ? `<div class="ai-actions"><button class="btn btn--gold" data-go="upload"><svg><use href="#i-upload"/></svg>${esc(t('nav_upload'))}</button></div>` : ''}
    <div class="cards">${res.map((v, i) => card(v, id, i)).join('')}</div>`;
  body.querySelectorAll('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go));
  body.querySelectorAll('[data-sup]').forEach(b => b.onclick = () => openSuppliers(+b.dataset.sup));
  body.querySelectorAll('[data-play]').forEach(b => b.onclick = () => {
    const v = results[b.dataset.set][+b.dataset.i]; play(v.id, v.filename, +b.dataset.t, v.frames);
  });
  if (opts.voice) speak(speech, opts.lang);
}

function card(v, set, i) {
  const best = v.frames.reduce((x, y) => y.score > x.score ? y : x);
  const meta = [v.duration ? fmtT(v.duration) : '', v.uploaded_by, fmtDate(v.created_at)].filter(Boolean).map(esc).join(' · ');
  return `<article class="vcard" style="animation-delay:${Math.min(i, 6) * 80}ms">
    <button class="vcard__media" data-play data-set="${set}" data-i="${i}" data-t="${best.t}" aria-label="${esc(v.filename)} ${fmtT(best.t)}">
      <img src="/thumb/${best.frame_id}" alt="" loading="lazy"><span class="play"><svg><use href="#i-play"/></svg></span>
      <span class="badge ${v.strength}">${esc(t(v.strength === 'strong' ? 'strong' : 'possible'))}</span>${v.text_match ? `<span class="badge text">${esc(t('text_match'))}</span>` : ''}<span class="tstamp">▶ ${fmtT(best.t)}</span>
    </button>
    <div class="vcard__body"><h3 title="${esc(v.title || v.filename)}">${v.source === 'lark' ? '<span class="tag-lark">Lark</span>' : ''}${esc(v.title || v.filename)}</h3><div class="meta">${meta}</div>
      ${facts(v.meta, v.title)}
      ${v.frames.length > 1 ? `<div class="moments">${v.frames.map(f => `<button class="moment ${f === best ? 'on' : ''}" data-play data-set="${set}" data-i="${i}" data-t="${f.t}"><img src="/thumb/${f.frame_id}" alt="" loading="lazy"><span>▶ ${fmtT(f.t)}</span></button>`).join('')}</div>` : ''}
      <button class="findsup" data-sup="${v.id}"><svg><use href="#i-factory"/></svg>${esc(t('sup_btn'))}</button>
    </div></article>`;
}

// Lark table details. Category columns (一级/二级/三级分类 …) become one path; long or private
// fields (company profile, contact, website) only show in the full view when a video is opened.
const DETAIL_ONLY = /简介|联系|电话|手机|微信|网站|邮箱|email|phone|contact|website|profile|alamat|telefon/i;
const LEVELS = ['一', '二', '三', '四', '五'];
function splitMeta(meta, title) {
  const entries = Object.entries(meta || {}).filter(([k, v]) => v && v !== title);
  const levelOf = k => { const m = k.match(/^([一二三四五]|\d)\s*级/); return m ? (LEVELS.indexOf(m[1]) + 1 || +m[1]) : 0; };
  const cats = entries.filter(([k]) => levelOf(k)).sort((a, b) => levelOf(a[0]) - levelOf(b[0]));
  const path = cats.map(([, v]) => v).filter((v, i, a) => v !== a[i - 1]).join(' › ');
  const rest = entries.filter(([k]) => !levelOf(k));
  const brief = rest.filter(([k, v]) => !DETAIL_ONLY.test(k) && v.length <= 80);
  return { path, brief, all: rest };
}
function facts(meta, title) {
  if (!meta) return '';
  const { path, brief } = splitMeta(meta, title);
  // prefer the fields people scan for; anything with a comma list (e.g. 类别1) goes last
  const pref = ['视频号', '备注', '地区'];
  brief.sort((a, b) => ((pref.indexOf(a[0]) + 1 || 99) - (pref.indexOf(b[0]) + 1 || 99)) || (a[1].includes(',') - b[1].includes(',')));
  const chips = brief.slice(0, path ? 3 : 4).map(([k, v]) => `<span title="${esc(k + ': ' + v)}"><b>${esc(k)}</b> ${esc(v.length > 36 ? v.slice(0, 36) + '…' : v)}</span>`);
  if (path) chips.unshift(`<span class="path" title="${esc(path)}">${esc(path)}</span>`);
  return chips.length ? `<div class="facts">${chips.join('')}</div>` : '';
}
function detailsHtml(d) {
  if (!d || !d.meta) return '';
  const { path, all } = splitMeta(d.meta, d.title);
  const val = v => /^https?:\/\/\S+$/.test(v) ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>` : esc(v);
  const rows = (path ? [[t('category'), path]] : []).concat(all, [[t('file'), d.filename]]);
  return `<div class="lbl">${esc(t('details'))}</div><dl class="details">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${val(v)}</dd>`).join('')}</dl>`;
}

// ---------- voice ----------
// Default: record the request and let OpenAI transcribe it (works the same in every browser and in
// the installed app, and copes with mixed Chinese/Malay/English). Recording stops by itself when the
// speaker pauses. Falls back to the phone's built-in speech recognition if OpenAI isn't available.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recorder = null;
function listen() {
  if (busy) return;
  if (rec) { rec.stop(); return; }
  if (recorder) { recorder.finish(); return; }
  stopSpeaking(); unlockAudio();
  if (CFG.voice_input && navigator.mediaDevices?.getUserMedia && window.MediaRecorder) listenOpenAI();
  else listenBrowser();
}

async function listenOpenAI() {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = AC ? new AC() : null;  // created inside the tap so iPhones allow it
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
  catch (e) { ac?.close(); toast(t(e && e.name === 'NotAllowedError' ? 'mic_blocked' : 'mic_fail')); return; }
  const type = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg'].find(m => MediaRecorder.isTypeSupported?.(m)) || '';
  let mr;
  try { mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined); }
  catch { stream.getTracks().forEach(tr => tr.stop()); ac?.close(); listenBrowser(); return; }
  const chunks = [];
  mr.ondataavailable = e => e.data && e.data.size && chunks.push(e.data);
  let spoke = false, cancelled = false, timer = null, raf = null;
  const done = () => { clearInterval(timer); cancelAnimationFrame(raf); stream.getTracks().forEach(tr => tr.stop()); ac?.close(); recorder = null; $('#orb').style.removeProperty('--lvl'); };
  recorder = { finish: () => mr.state !== 'inactive' && mr.stop(), cancel: () => { cancelled = true; mr.state !== 'inactive' && mr.stop(); } };

  // voice level -> orb animation, and end-of-speech detection
  if (ac) {
    const an = ac.createAnalyser(); an.fftSize = 1024; ac.createMediaStreamSource(stream).connect(an);
    const buf = new Float32Array(an.fftSize);
    const started = Date.now(); let floor = 0.01, n = 0, lastVoice = Date.now();
    const level = () => { an.getFloatTimeDomainData(buf); let sum = 0; for (const v of buf) sum += v * v; return Math.sqrt(sum / buf.length); };
    const draw = () => { const l = level(); $('#orb').style.setProperty('--lvl', Math.min(1, l * 9).toFixed(3)); raf = requestAnimationFrame(draw); };
    draw();
    timer = setInterval(() => {
      const l = level(), age = Date.now() - started;
      if (age < 400) { floor = (floor * n + l) / ++n; return; }  // learn the room's background noise
      if (l > Math.max(floor * 3, 0.02)) { spoke = true; lastVoice = Date.now(); }
      if (spoke && Date.now() - lastVoice > 1300) recorder?.finish();               // paused after speaking
      if (!spoke && age > 7000) { cancelled = true; toast(t('no_speech')); recorder?.finish(); }  // never spoke
      if (age > 20000) recorder?.finish();                                          // hard limit
    }, 100);
  } else {
    timer = setInterval(() => {}, 1000);
    setTimeout(() => recorder?.finish(), 8000);
  }

  mr.onstop = async () => {
    done();
    if (cancelled || !chunks.length) { setStage('idle'); return; }
    setStage('thinking'); $('#status').textContent = t('transcribing'); $('#live').textContent = '';
    const blob = new Blob(chunks, { type: mr.mimeType || type || 'audio/webm' });
    const fd = new FormData(); fd.append('audio', blob, 'speech'); fd.append('lang', I18N.lang);
    let text = null;
    try { const r = await api('/api/transcribe', { method: 'POST', body: fd }); if (r.ok) text = (await r.json()).text; } catch {}
    if (text === null) { CFG.voice_input = false; setStage('idle'); toast(t('voice_fallback')); return; }  // use the phone's recogniser from now on
    if (!text.trim()) { setStage('idle'); toast(t('no_speech')); return; }
    $('#live').textContent = '“' + text.trim() + '”';
    ask(text.trim(), { voice: true, lang: I18N.lang });
  };
  mr.start(250);
  setStage('listening');
}

function listenBrowser() {
  if (!SR) { toast(t('voice_unsupported')); q.focus(); return; }
  const lang = I18N.voiceCode();
  rec = new SR(); rec.lang = lang; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  let heard = '', aborted = false;
  rec.onresult = e => { heard = Array.from(e.results).map(r => r[0].transcript).join(''); $('#live').textContent = '“' + heard + '”'; };
  rec.onerror = e => {
    if (e.error === 'aborted') { aborted = true; return; }
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast(t('mic_blocked'));
    else if (e.error === 'no-speech') toast(t('no_speech'));
    else toast(t('voice_err', { e: e.error }));
  };
  rec.onend = () => { rec = null; const v = heard.trim(); if (v && !aborted) ask(v, { voice: true, lang: I18N.lang }); else setStage('idle'); };
  try { rec.start(); setStage('listening'); } catch { rec = null; toast(t('mic_fail')); setStage('idle'); }
}
$('#orb').onclick = listen;
$('#miniorb').onclick = listen;
// Spoken replies: natural OpenAI voice when configured, otherwise the browser's own voice.
let CFG = {};
api('/api/config').then(r => r.json()).then(c => { CFG = c; }).catch(() => {});
const voicePlayer = new Audio();
function unlockAudio() { if (!CFG.natural_voice) return; try { voicePlayer.src = '/static/silence.mp3'; voicePlayer.play().catch(() => {}); } catch {} }
function stopSpeaking() { try { voicePlayer.pause(); } catch {} if ('speechSynthesis' in window) speechSynthesis.cancel(); }
async function speak(text, lang) {
  text = text.replace(/<[^>]+>/g, '');
  stopSpeaking();
  if (CFG.natural_voice) {
    try {
      const r = await fetch('/api/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, lang: lang || I18N.lang }) });
      if (r.status === 200) { voicePlayer.src = URL.createObjectURL(await r.blob()); await voicePlayer.play(); return; }
    } catch {}
  }
  browserSpeak(text, lang);
}
function browserSpeak(text, lang) {
  if (!('speechSynthesis' in window)) return;
  const code = I18N.voiceCode(lang), base = code.slice(0, 2).toLowerCase();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = code; u.rate = 1.02;
  const voices = speechSynthesis.getVoices();
  const v = voices.find(v => v.lang.replace('_', '-').toLowerCase() === code.toLowerCase()) || voices.find(v => v.lang.toLowerCase().startsWith(base));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

// ---------- player ----------
function play(id, name, at, frames) {
  stopSpeaking();
  const v = $('#vid');
  v.src = `/media/${id}`;
  v.onloadedmetadata = () => { v.currentTime = Math.max(0, (at || 0) - 0.5); v.play().catch(() => {}); };
  $('#pname').textContent = name;
  $('#pdl').href = `/media/${id}?download=1`;
  const fr = (frames || []).slice().sort((a, b) => a.t - b.t);
  $('#jumpwrap').classList.toggle('hidden', fr.length < 1);
  $('#jumps').innerHTML = fr.map(f => `<button data-t="${f.t}">▶ ${fmtT(f.t)}</button>`).join('');
  $('#jumps').querySelectorAll('button').forEach(b => b.onclick = () => { v.currentTime = Math.max(0, +b.dataset.t - 0.5); v.play(); });
  $('#pinfo').innerHTML = '';
  $('#psup').onclick = () => { $('#player').close(); openSuppliers(id); };
  api(`/api/videos/${id}`).then(r => r.ok ? r.json() : null).then(d => {
    if (!d) return;
    if (d.title) $('#pname').textContent = d.title;
    $('#pinfo').innerHTML = detailsHtml(d);
  }).catch(() => {});
  $('#player').showModal();
}
$('#pclose').onclick = () => $('#player').close();
$('#player').addEventListener('close', () => { const v = $('#vid'); v.pause(); v.removeAttribute('src'); v.load(); });

// ---------- upload ----------
const drop = $('#drop'), queue = []; let active = 0; const MAX_PARALLEL = 3;
$('#files').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
function addFiles(list) {
  for (const f of list) {
    const row = document.createElement('div'); row.className = 'up';
    row.innerHTML = `<div class="n">${esc(f.name)}</div><div class="s">${fmtSize(f.size)} · ${esc(t('waiting'))}</div><div class="prog"><i></i></div>`;
    $('#uplist').prepend(row); queue.push({ f, row });
  }
  pump();
}
window.addEventListener('beforeunload', e => { if (active || queue.length) { e.preventDefault(); e.returnValue = ''; } });
function pump() {
  while (active < MAX_PARALLEL && queue.length) {
    const { f, row } = queue.shift(); active++;
    const xhr = new XMLHttpRequest(), fd = new FormData(); fd.append('file', f);
    const s = row.querySelector('.s');
    xhr.open('POST', '/api/upload');
    xhr.upload.onprogress = e => { if (e.lengthComputable) { const p = Math.round(100 * e.loaded / e.total); row.querySelector('i').style.width = p + '%'; s.textContent = `${fmtSize(f.size)} · ${p}%`; } };
    xhr.onload = () => {
      if (xhr.status === 401) location.href = '/login';
      if (xhr.status === 200) { s.textContent = t('uploaded'); s.className = 's ok'; loadStats(); }
      else { let m = t('failed'); try { m = JSON.parse(xhr.responseText).error; } catch {} s.textContent = m; s.className = 's bad'; }
      active--; pump();
    };
    xhr.onerror = () => { s.textContent = t('net_err'); s.className = 's bad'; active--; pump(); };
    xhr.send(fd);
  }
}

// ---------- Lark import ----------
let larkTimer = null, larkData = { configured: false, sources: [] };
async function loadLark() {
  clearTimeout(larkTimer);
  try { larkData = await (await api('/api/lark')).json(); } catch { return; }
  renderLark();
  if (larkData.sources.some(s => ['queued', 'syncing'].includes(s.status)) && !$('#view-upload').classList.contains('hidden')) larkTimer = setTimeout(loadLark, 3000);
}
function renderLark() {
  $('#larkSetup').classList.toggle('hidden', larkData.configured);
  $('#larkForm').classList.toggle('hidden', !larkData.configured);
  const when = ts => ts ? new Date(ts * 1000).toLocaleString(I18N.locale(), { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : t('lark_never');
  $('#larkList').innerHTML = larkData.sources.map(s => {
    const msg = s.status === 'error' ? s.message : s.status === 'syncing' ? (s.message || '') : s.status === 'queued' ? t('s_queue') : t('lark_counts', { found: s.found || 0, imported: s.imported || 0 });
    const rng = s.row_from && s.row_to ? t('rng_ab', { a: s.row_from, b: s.row_to }) : s.row_from ? t('rng_from', { a: s.row_from }) : s.row_to ? t('rng_ab', { a: 1, b: s.row_to }) : t('rng_all');
    return `<div class="src" data-id="${s.id}"><div class="nm" title="${esc(s.url)}">${esc(s.name || s.url)}<span class="pill ${esc(s.status)}">${esc(t('ls_' + s.status))}</span></div>
      <div class="acts"><button data-edit="${s.id}">${esc(t('rng_change'))}</button><button data-sync="${s.id}">${esc(t('lark_sync'))}</button><button data-rm="${s.id}">${esc(t('lark_remove'))}</button></div>
      <div class="rng">${esc(rng)}${s.view_id ? ' · ' + esc(t('rng_view')) : ''}</div>
      <div class="msg ${s.status === 'error' ? 'bad' : ''}">${esc(msg)} · ${esc(t('lark_last'))} ${esc(when(s.last_sync))}</div></div>`;
  }).join('');
  $('#larkList').querySelectorAll('[data-sync]').forEach(b => b.onclick = async () => { await api(`/api/lark/${b.dataset.sync}/sync`, { method: 'POST' }); toast(t('lark_started')); setTimeout(loadLark, 800); });
  $('#larkList').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    clearTimeout(larkTimer);
    const s = larkData.sources.find(x => x.id == b.dataset.edit), box = b.closest('.src');
    box.querySelector('.edit')?.remove();
    const ed = document.createElement('div'); ed.className = 'edit';
    ed.innerHTML = `<span>${esc(t('rf_a'))}</span><input type="number" min="1" inputmode="numeric" placeholder="1" value="${s.row_from || ''}"><span>${esc(t('rf_b'))}</span>
      <input type="number" min="1" inputmode="numeric" placeholder="${esc(t('rf_last'))}" value="${s.row_to || ''}"><span>${esc(t('rf_c'))}</span>
      <button data-save>${esc(t('rng_save'))}</button><button class="ghost" data-cancel>${esc(t('cancel'))}</button>`;
    box.append(ed);
    ed.querySelector('[data-cancel]').onclick = () => loadLark();
    ed.querySelector('[data-save]').onclick = async () => {
      const [a, z] = ed.querySelectorAll('input');
      const r = await api('/api/lark/' + s.id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ row_from: a.value, row_to: z.value }) });
      if (!r.ok) { toast(t('rng_bad')); return; }
      toast(t('lark_started')); loadLark();
    };
  });
  $('#larkList').querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => { if (!confirm(t('lark_confirm_rm'))) return; await api('/api/lark/' + b.dataset.rm, { method: 'DELETE' }); loadLark(); });
}
$('#larkForm').onsubmit = async e => {
  e.preventDefault();
  const r = await api('/api/lark', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url: $('#larkUrl').value, row_from: $('#rowFrom').value, row_to: $('#rowTo').value }) });
  if (!r.ok) { const e = await r.json().catch(() => ({})); toast(t(e.error === 'bad_range' ? 'rng_bad' : 'lark_bad_link')); return; }
  $('#larkUrl').value = ''; $('#rowFrom').value = ''; $('#rowTo').value = ''; toast(t('lark_started')); loadLark();
};

// ---------- library ----------
let libTimer = null, libData = [];
async function loadLib() {
  clearTimeout(libTimer);
  try { libData = await (await api('/api/videos')).json(); } catch { return; }
  renderLib();
  if (libData.some(v => !['ready','error'].includes(v.status)) && !$('#view-library').classList.contains('hidden')) libTimer = setTimeout(loadLib, 3000);
}
$('#libfilter').oninput = renderLib;
function renderLib() {
  const f = $('#libfilter').value.toLowerCase();
  const ready = libData.filter(v => v.status === 'ready').length;
  const total = libData.reduce((a, v) => a + (v.size || 0), 0);
  const mins = libData.reduce((a, v) => a + (v.duration || 0), 0) / 60;
  $('#stats').innerHTML = [[libData.length, t('st_videos')], [ready, t('st_searchable')], [mins >= 60 ? (mins / 60).toFixed(1) + ' h' : Math.round(mins) + ' min', t('st_footage')], [fmtSize(total), t('st_stored')]]
    .map(([n, l]) => `<div class="stat"><b>${n}</b><span>${esc(l)}</span></div>`).join('');
  const label = v => v.status === 'ready' ? ['ready', t('s_ready')] : v.status === 'error' ? ['error', t('s_error')] :
    v.status === 'converting' ? ['wait', t('s_conv')] : v.status === 'indexing' ? ['wait', t('s_idx', { p: Math.round(100 * (v.progress || 0)) })] : ['wait', t('s_queue')];
  const list = libData.filter(v => (v.filename + ' ' + (v.title || '')).toLowerCase().includes(f));
  $('#lib').innerHTML = list.map(v => { const [cls, txt] = label(v); return `
    <div class="lcard">
      <button class="cov" data-id="${v.id}" style="${v.cover ? `background-image:url(/thumb/${v.cover})` : ''}" aria-label="${esc(v.filename)}"></button>
      <div class="b"><div class="t" title="${esc(v.title || v.filename)}">${v.source === 'lark' ? '<span class="tag-lark">Lark</span>' : ''}${esc(v.title || v.filename)}</div>
        <div class="meta">${[v.duration ? fmtT(v.duration) : '', fmtSize(v.size || 0), v.uploaded_by].filter(Boolean).map(esc).join(' · ')}</div>
        <div class="row"><span class="st ${cls}" title="${esc(v.error || '')}">${esc(txt)}</span><button class="del" data-id="${v.id}">${esc(t('delete'))}</button></div></div>
    </div>`; }).join('') || `<div class="empty">${esc(t(libData.length ? 'no_match_name' : 'no_videos'))}</div>`;
  $('#lib').querySelectorAll('.cov').forEach(el => el.onclick = () => { const v = libData.find(x => x.id == el.dataset.id); if (v.status === 'ready') play(v.id, v.filename, 0); else toast(t('still_proc')); });
  $('#lib').querySelectorAll('.del').forEach(el => el.onclick = async () => {
    const v = libData.find(x => x.id == el.dataset.id);
    if (!confirm(t('confirm_del', { f: v.filename }))) return;
    const r = await api('/api/videos/' + v.id, { method: 'DELETE' });
    if (!r.ok) toast((await r.json()).error || t('cant_delete')); loadLib(); loadStats();
  });
}

// ---------- find the same product / suppliers ----------
const PLATS = { '1688': ['1688', '#ff6a00', 'sup_p1688'], taobao: ['淘宝', '#ff5000', 'sup_ptaobao'], alibaba: ['A', '#ff6a00', 'sup_palibaba'],
  mic: ['MIC', '#c8161e', 'sup_pmic'], lens: ['📷', '#1a73e8', 'sup_plens'], google: ['G', '#4285f4', 'sup_pgoogle'] };
const PLAT_NAMES = { '1688': '1688', taobao: '淘宝 Taobao', alibaba: 'Alibaba.com', mic: 'Made-in-China', lens: 'Google Lens', google: 'Google' };
function supplierOf(v) {
  const m = v.meta || {};
  return { key: m['公司简介'] || m['视频号'] || v.title || v.filename, name: m['公司简介'] || v.title || v.filename,
    sub: [m['视频号'] ? t('sup_channel') + ' ' + m['视频号'] : '', m['地区'] || m['公司地址'] || ''].filter(Boolean).join(' · '),
    contact: m['联系方式'] || '', site: m['网站'] || '', channel: m['视频号'] || '', product: v.title || '' };
}
function contactActions(sp) {
  const out = [], txt = sp.contact || '';
  const phones = [...new Set((txt.match(/\+?\d[\d\s-]{6,}\d/g) || []).map(x => x.replace(/[\s-]/g, '')).filter(x => x.length >= 7 && x.length <= 15))];
  phones.slice(0, 2).forEach(ph => out.push(`<a class="call" href="tel:${esc(ph)}">📞 ${esc(t('sup_call'))} ${esc(ph)}</a>`));
  const wx = txt.match(/(?:微信号?|wechat|vx|wx)\s*[:：]?\s*([A-Za-z][\w-]{4,19})/i);
  if (wx) out.push(`<button data-copy="${esc(wx[1])}">💬 ${esc(t('sup_copywx'))} ${esc(wx[1])}</button>`);
  if (sp.site && /^https?:/.test(sp.site)) out.push(`<a href="${esc(sp.site)}" target="_blank" rel="noopener">🌐 ${esc(t('sup_site'))}</a>`);
  if (sp.channel) out.push(`<button data-copy="${esc(sp.channel)}">${esc(t('sup_copych'))}</button>`);
  if (!phones.length && !wx && txt) out.push(`<button data-copy="${esc(txt)}">📋 ${esc(t('sup_copycontact'))}</button>`);
  return out.join('');
}
let supVid = null, supPoll = null, supData = {};
async function openSuppliers(vid) {
  supVid = vid; clearTimeout(supPoll); stopSpeaking();
  const body = $('#supBody');
  body.innerHTML = `<div class="skel" style="width:60%"></div><div class="skel"></div><div class="skel" style="width:80%"></div>`;
  $('#supSheet').showModal(); body.scrollTop = 0;
  let sim;
  try { sim = await (await api(`/api/videos/${vid}/similar`)).json(); } catch { body.innerHTML = `<p class="note">${esc(t('error'))}</p>`; return; }
  if (supVid !== vid) return;
  const me = sim.video, mySup = supplierOf(me);
  // group similar videos by supplier
  const groups = new Map();
  for (const v of sim.similar) { const sp = supplierOf(v); if (sp.key === mySup.key) continue;
    if (!groups.has(sp.key)) groups.set(sp.key, { sp, vids: [], best: v.similarity, level: v.level }); groups.get(sp.key).vids.push(v); }
  supData = { me, list: sim.similar };
  const thumbs = vids => `<div class="thumbs">${vids.map(v => `<button data-playv="${v.id}" data-t="${v.t || 0}"><img src="/thumb/${v.frame_id}" alt="" loading="lazy"><span>▶ ${fmtT(v.t || 0)}</span></button>`).join('')}</div>`;
  const card = (sp, extra, cls = '') => `<div class="scard ${cls}"><div class="nm">${esc(sp.name)}${extra}</div>${sp.sub ? `<div class="sub">${esc(sp.sub)}</div>` : ''}
      ${sp.product && sp.product !== sp.name ? `<div class="desc">${esc(sp.product)}</div>` : ''}<div class="acts2">${contactActions(sp) || `<span class="sub">${esc(t('sup_nocontact'))}</span>`}</div>`;
  const libHtml = [...groups.values()].map(g => card(g.sp, `<span class="lvl ${g.level}">${esc(t(g.level === 'same' ? 'sup_same' : 'sup_similar'))}</span>`) + thumbs(g.vids) + '</div>').join('');
  body.innerHTML = `
    <div class="sup__hero">${me.cover ? `<img src="/thumb/${me.cover}" alt="">` : ''}<div><h3>${esc(me.title || me.filename)}</h3><p id="supSummary"><span class="skel" style="display:block;width:180px"></span></p></div></div>
    ${me.meta && (me.meta['联系方式'] || me.meta['公司简介'] || me.meta['视频号']) ? `<h4>${esc(t('sup_this'))}</h4>${card(mySup, `<span class="lvl mine">${esc(t('sup_mine'))}</span>`, 'mine')}</div>` : ''}
    <h4>${esc(t('sup_lib'))} (${groups.size})</h4>
    ${groups.size ? `<p class="note">${esc(t('sup_lib_note'))}</p>` + libHtml : `<p class="note">${esc(t('sup_lib_none'))}</p>`}
    <h4>${esc(t('sup_web'))}</h4><div id="supWeb"><div class="skel"></div><div class="skel" style="width:70%"></div></div>
    <h4>${esc(t('sup_deep'))}</h4><div id="supDeep"></div>`;
  bindSupActions(body);
  // AI product description + platform links
  api(`/api/videos/${vid}/product`).then(r => r.json()).then(d => {
    if (supVid !== vid) return;
    const p = d.product || {};
    $('#supSummary').textContent = p.summary_zh || p.name_zh || '';
    const kws = [...(p.keywords_zh || []), ...(p.keywords_en || [])].slice(0, 8);
    $('#supWeb').innerHTML = `${p.fallback ? `<p class="note">${esc(t('sup_noai'))}</p>` : ''}
      ${kws.length ? `<div class="kw">${kws.map(k => `<span>${esc(k)}</span>`).join('')}</div>` : ''}
      <div class="plats">${(d.links || []).map(l => { const [ic, col, sub] = PLATS[l.key] || ['•', '#555', '']; return `<a href="${esc(l.url)}" target="_blank" rel="noopener"><i style="background:${col}">${ic}</i><span>${esc(PLAT_NAMES[l.key] || l.key)}<small>${esc(t(sub))}</small></span></a>`; }).join('')}</div>`;
  }).catch(() => { $('#supWeb').innerHTML = `<p class="note">${esc(t('error'))}</p>`; });
  loadDeep(vid, false);
}
function bindSupActions(root) {
  root.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast(t('sup_copied')); } catch { prompt(t('sup_copycontact'), b.dataset.copy); } });
  root.querySelectorAll('[data-playv]').forEach(b => b.onclick = () => { const v = supData.list.find(x => x.id == b.dataset.playv); play(v.id, v.title || v.filename, +b.dataset.t, [{ t: +b.dataset.t, frame_id: v.frame_id }]); });
}
async function loadDeep(vid, start) {
  const box = $('#supDeep'); if (!box || supVid !== vid) return;
  clearTimeout(supPoll);
  let d;
  try { d = start ? await (await api(`/api/videos/${vid}/research`, { method: 'POST' })).json() : await (await api(`/api/videos/${vid}/research`)).json(); }
  catch { box.innerHTML = `<p class="note">${esc(t('error'))}</p>`; return; }
  if (d.error === 'no_ai') { box.innerHTML = `<p class="note">${esc(t('sup_noai'))}</p>`; return; }
  if (d.status === 'running') {
    box.innerHTML = `<div class="working"><span class="dots"><i></i><i></i><i></i></span>${esc(t('sup_deep_running'))}</div>`;
    supPoll = setTimeout(() => loadDeep(vid, false), 4000); return;
  }
  const btn = (label) => `<button class="deepbtn" id="deepGo"><svg width="18" height="18"><use href="#i-spark"/></svg>${esc(label)}</button>`;
  if (d.status === 'done' && d.result) {
    const r = d.result, when = d.updated_at ? new Date(d.updated_at * 1000).toLocaleString(I18N.locale(), { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    box.innerHTML = `${r.summary_zh ? `<p class="desc" style="margin:0 0 10px">${esc(r.summary_zh)}</p>` : ''}
      ${(r.suppliers || []).map(sp => `<div class="scard"><div class="nm">${esc(sp.name)}</div>
        <div class="sub">${esc([sp.location, sp.type].filter(Boolean).join(' · '))}</div>
        ${sp.products ? `<div class="desc">${esc(sp.products)}</div>` : ''}
        ${sp.price || sp.moq ? `<div class="desc" style="color:var(--gold-300)">${esc([sp.price, sp.moq && (t('sup_moq') + ' ' + sp.moq)].filter(Boolean).join(' · '))}</div>` : ''}
        ${sp.why_zh ? `<div class="sub" style="margin-top:4px">✓ ${esc(sp.why_zh)}</div>` : ''}
        <div class="acts2">${sp.url ? `<a class="call" href="${esc(sp.url)}" target="_blank" rel="noopener">🔗 ${esc(t('sup_open'))}</a>` : ''}${contactActions({ contact: sp.contact })}</div></div>`).join('') || `<p class="note">${esc(t('sup_deep_none'))}</p>`}
      ${(r.sources || []).length ? `<details class="sources"><summary>${esc(t('sup_sources'))} (${r.sources.length})</summary>${r.sources.map(s => `<div><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a></div>`).join('')}</details>` : ''}
      <p class="disclaim">${esc(t('sup_disclaim'))} ${when ? '· ' + esc(when) : ''}</p>${btn(t('sup_deep_again'))}`;
  } else {
    box.innerHTML = `<p class="note">${esc(d.status === 'error' ? t('sup_deep_err') : t('sup_deep_note'))}</p>${btn(t('sup_deep_go'))}`;
  }
  bindSupActions(box);
  $('#deepGo').onclick = () => loadDeep(vid, true);
}
$('#supClose').onclick = () => { clearTimeout(supPoll); supVid = null; $('#supSheet').close(); };

// ---------- install the app (PWA) ----------
function refreshInstall() {
  const mode = window.PWA && PWA.mode();
  document.querySelectorAll('.navitem[data-install]').forEach(b => b.classList.toggle('hidden', !mode));
  let dismissed = false; try { dismissed = localStorage.getItem('installDismissed') === '1'; } catch {}
  $('#installCard').classList.toggle('hidden', !mode || dismissed || $('#view-ask').classList.contains('hidden'));
}
document.querySelectorAll('[data-install]').forEach(b => b.onclick = async () => {
  closeDrawer();
  if (PWA.mode() === 'prompt') { if (await PWA.install()) toast(t('installed')); }
  else { $('#iosInApp').classList.toggle('hidden', !PWA.iosInApp); $('#iosSteps').classList.toggle('hidden', PWA.iosInApp); $('#iosSheet').showModal(); }
  refreshInstall();
});
$('#installX').onclick = () => { try { localStorage.setItem('installDismissed', '1'); } catch {} refreshInstall(); };
$('#iosOk').onclick = () => $('#iosSheet').close();
$('#iosSheet').addEventListener('click', e => { if (e.target === $('#iosSheet')) $('#iosSheet').close(); });
addEventListener('pwa-change', refreshInstall);
addEventListener('pwa-installed', () => toast(t('installed')));
setTimeout(refreshInstall, 2500);  // invite after a moment, not on first paint

renderStatic();
show('ask');
loadStats();
</script>
