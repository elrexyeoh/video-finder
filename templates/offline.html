<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F45">
<title>Video Finder</title>
<link rel="stylesheet" href="/static/theme.css?v=9">
<style>
  body{min-height:100dvh;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:radial-gradient(120% 80% at 50% 0%,#163a7c 0%,#0F2A5C 40%,#0B1F45 78%);color:#fff;font-family:var(--sans)}
  img{height:28px;margin-bottom:34px}
  h1{font-family:var(--serif);font-weight:500;font-size:34px;margin:0 0 10px}
  p{color:rgba(255,255,255,.72);margin:0 0 28px;max-width:340px}
  button{height:50px;padding:0 34px;border:0;border-radius:999px;background:var(--gold-grad);color:var(--navy-1000);font:inherit;font-weight:700;letter-spacing:.04em}
</style>
</head>
<body>
<img src="/static/logo-light.png" alt="TSLAW Group">
<h1 id="h">无法连接网络</h1>
<p id="p">请检查手机的网络连接，然后重试。</p>
<button id="b" onclick="location.reload()">重试</button>
<script>
try {
  const l = localStorage.getItem('uiLang');
  const T = { en: ['No connection', 'Check your phone’s internet connection, then try again.', 'Try again'],
              ms: ['Tiada sambungan', 'Semak sambungan internet telefon anda, kemudian cuba lagi.', 'Cuba lagi'] }[l];
  if (T) { h.textContent = T[0]; p.textContent = T[1]; b.textContent = T[2]; document.documentElement.lang = l; }
} catch {}
addEventListener('online', () => location.reload());
</script>
</body>
</html>
